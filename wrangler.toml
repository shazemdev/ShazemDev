# Cloudflare Workers config — an assets-only Worker (`npm run deploy`).
#
# There is no `main` entry point on purpose: the site is fully static, so the
# Worker serves `out/` directly and never runs any code. Do not add one — a
# static export has no server logic to run.
#
name = "shazem-dev"
compatibility_date = "2026-07-25"

# The workers.dev URL is off on purpose: the custom domains below are the only
# public addresses, so search engines never see the same site on a second
# hostname. This must stay declared — every `wrangler deploy` reconciles it, so
# leaving it out or setting it true would resurrect the URL.
#
# The one risk it reintroduces: if a custom domain ever fails to attach, the
# Worker is left with no route at all and 404s everywhere. That happened once
# during setup. If a deploy ever reports "No targets deployed", set this to true
# temporarily to get the site back up, then fix the route.
workers_dev = false

# Preview URLs stay on, which `deploy:preview` needs. They would otherwise
# default to off along with workers.dev. Each is a per-version hostname that is
# never linked publicly.
preview_urls = true

# Custom domains. Wrangler reconciles this list on every deploy and creates the
# DNS records itself, so BOTH hostnames must stay declared here — dropping one
# would detach it on the next deploy.
#
# Both serve the same site. www.shazem.dev is canonical, set by `metadataBase`
# in app/layout.tsx — if you ever flip that to the apex, change it there, not
# here.
routes = [
  { pattern = "shazem.dev", custom_domain = true },
  { pattern = "www.shazem.dev", custom_domain = true },
]

[assets]
directory = "./out"

# Serve out/404.html with a real 404 status for unmatched paths — that file is
# what Next.js writes app/not-found.tsx to.
not_found_handling = "404-page"
